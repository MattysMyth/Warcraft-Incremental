<title>Outpost of Azeroth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout concept: a warden's ledger. One column of rows on a phone; on a wide
   screen the building ledger sits beside a narrow column of notes. Dark first,
   Alliance blue and old gold, with an old-print display face for headings. */
:root {
  --font-display: "IM Fell English SC", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, -apple-system, "Segoe UI", sans-serif;

  --bg: #0f141b;
  --panel: #161d27;
  --panel-2: #1d2733;
  --line: #2d3949;
  --line-soft: #222d3b;
  --text: #ebe6d8;
  --muted: #9ba6b6;
  --accent: #d8a640;
  --accent-ink: #1a1405;
  --blue: #7aa2e6;
  --good: #7cc79a;
  --warn: #e0b45a;
  --bad: #ee9484;
  --res-gold: #e3b64f;
  --res-lumber: #cf9f6a;
  --res-stone: #adbacb;
  --res-food: #a6cf7e;
  --res-iron: #b9a79a;
  --res-herbs: #84c9a0;
  --res-arcane: #b79af0;
  --res-leather: #d19a6a;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edeff3; --panel: #ffffff; --panel-2: #f2f4f8; --line: #cfd6e1; --line-soft: #e2e7ee;
    --text: #1a2230; --muted: #566277; --accent: #8a5a06; --accent-ink: #fffaf0; --blue: #2f5fb0;
    --good: #2b7449; --warn: #8a6208; --bad: #b0402b;
    --res-gold: #9a6a08; --res-lumber: #84552a; --res-stone: #526176; --res-food: #46722a; --res-iron: #7a5f4c; --res-herbs: #2b7a50; --res-arcane: #6b46b8; --res-leather: #8a5a2e;
    --shadow: 0 1px 0 rgba(20, 30, 50, 0.08);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edeff3; --panel: #ffffff; --panel-2: #f2f4f8; --line: #cfd6e1; --line-soft: #e2e7ee;
  --text: #1a2230; --muted: #566277; --accent: #8a5a06; --accent-ink: #fffaf0; --blue: #2f5fb0;
  --good: #2b7449; --warn: #8a6208; --bad: #b0402b;
  --res-gold: #9a6a08; --res-lumber: #84552a; --res-stone: #526176; --res-food: #46722a; --res-iron: #7a5f4c; --res-herbs: #2b7a50; --res-arcane: #6b46b8; --res-leather: #8a5a2e;
  --shadow: 0 1px 0 rgba(20, 30, 50, 0.08);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 96px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
#app { max-width: 1040px; margin: 0 auto; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }

/* Masthead */
.masthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 8px 0 14px; }
.kicker { font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.title { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; letter-spacing: 0.02em; text-wrap: balance; }
.save-chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.save-chip.bad { color: var(--bad); border-color: var(--bad); }
.notice { border: 1px solid var(--bad); color: var(--text); background: var(--panel); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }

/* Resource strip */
.res-wrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 6px 0 10px; }
.res-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.res {
  display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left;
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font: inherit; cursor: pointer; box-shadow: var(--shadow);
}
.res:hover { border-color: var(--muted); }
.res.is-open { border-color: var(--accent); }
.res .icon { color: var(--res-gold); flex: none; }
.res-lumber .icon { color: var(--res-lumber); }
.res-stone .icon { color: var(--res-stone); }
.res-food .icon { color: var(--res-food); }
.res-iron_ore .icon, .res-iron_bars .icon { color: var(--res-iron); }
.res-herbs .icon { color: var(--res-herbs); }
.res-leather .icon { color: var(--res-leather); }
.res-arcane_dust .icon { color: var(--res-arcane); }
.res-line { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
.res-cap { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.res.is-full { border-color: var(--warn); }
.res.is-full .res-rate, .res.is-low .res-rate { color: var(--warn); }
.res.is-low { border-color: var(--bad); }
.res.is-low .res-rate { color: var(--bad); }
.res-text { display: grid; min-width: 0; line-height: 1.2; }
.res-name { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.res-value { font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res-rate { font-size: 12.5px; color: var(--muted); }
.breakdown { margin-top: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.breakdown-title { font-weight: 600; margin-bottom: 4px; }
.breakdown ul { display: grid; gap: 2px; margin-bottom: 4px; }
.breakdown li, .breakdown-total, .goals li, .gains li { display: flex; gap: 8px; align-items: baseline; }
.breakdown-total { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 600; }
.lead { flex: 1; border-bottom: 1px dotted var(--line); transform: translateY(-3px); min-width: 12px; }

/* Tabs: bottom bar on phones, a quiet row on wide screens */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.tabs-inner { max-width: 1040px; margin: 0 auto; display: flex; gap: 4px; }
.tab { flex: 1; min-height: 44px; background: none; border: 0; border-radius: 8px; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
.tab.is-active { color: var(--text); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--accent); }
.tab:hover { color: var(--text); }

/* Panels and cards */
.main { padding-top: 4px; }
.panel { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); align-content: start; }
.h-sec { font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: 0.03em; }
.h-sub { font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.town-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.town-main { display: grid; gap: 12px; min-width: 0; }
.aside { display: grid; gap: 14px; align-content: start; min-width: 0; }
.goals, .events, .gains { display: grid; gap: 6px; font-size: 14px; }
.events li { display: flex; gap: 10px; }
.events time { color: var(--muted); flex: none; }
.welcome { border-color: var(--accent); }
.gains { max-width: 340px; }

/* Toolbar */
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.buy-amount { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.toolbar-label { font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-btn { min-width: 48px; min-height: 40px; background: var(--panel); color: var(--muted); border: 0; font: inherit; font-weight: 600; cursor: pointer; }
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }
.seg-btn.is-on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 14px; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-accent:hover:not([disabled]) { filter: brightness(1.08); border-color: var(--accent); }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.tribute .icon { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Building ledger */
.ledger { display: grid; gap: 10px; }
.building { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); }
.b-icon { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--blue); }
.b-icon .icon svg { width: 28px; height: 28px; }
.b-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.b-name { font-family: var(--font-display); font-weight: 400; font-size: 21px; letter-spacing: 0.02em; }
.b-level { font-size: 12.5px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.b-level.is-zero { color: var(--muted); }
.b-blurb { color: var(--muted); font-size: 14px; }
.b-prod { margin-top: 4px; font-size: 14px; }
.b-pips { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.pips { display: inline-flex; gap: 4px; }
.pip { width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid var(--muted); }
.pip.on { background: var(--accent); border-color: var(--accent); }
.b-buy { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; }
.costs { display: flex; gap: 12px; flex-wrap: wrap; }
.cost { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.cost svg { width: 18px; height: 18px; }
.cost-gold .icon { color: var(--res-gold); }
.cost-lumber .icon { color: var(--res-lumber); }
.cost-stone .icon { color: var(--res-stone); }
.cost-food .icon { color: var(--res-food); }
.cost-iron_ore .icon, .cost-iron_bars .icon { color: var(--res-iron); }
.cost-herbs .icon { color: var(--res-herbs); }
.cost-leather .icon { color: var(--res-leather); }
.cost-arcane_dust .icon { color: var(--res-arcane); }
.cost.lack .cost-v { color: var(--bad); }
.b-eta { font-size: 13px; color: var(--muted); flex: 1; min-width: 120px; }
.b-eta.is-ready { color: var(--good); }
.buy { min-width: 128px; margin-left: auto; }

/* Town Hall, residents, workers, further buildings */
.townhall { border-color: var(--accent); }
.th-head { display: flex; gap: 12px; align-items: center; }
.townhall .b-buy { grid-column: auto; width: auto; flex-direction: row; align-items: center; justify-content: flex-start; border-top: 1px dashed var(--line); padding-top: 10px; }
.townhall .b-eta { text-align: left; flex: 1; }
.big { font-family: var(--font-display); font-size: 24px; line-height: 1.2; }
.warn-box { border: 1px solid var(--bad); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.card.is-hungry { border-color: var(--bad); }
.workers { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; font-size: 14px; }
.workers .icon { color: var(--blue); }
.workers .icon svg { width: 18px; height: 18px; }
.ws-label { color: var(--muted); }
.ws-btn { min-width: 40px; min-height: 40px; padding: 0; font-size: 20px; line-height: 1; }
.ws-count { min-width: 3.4em; text-align: center; font-weight: 600; }
.ws-bonus { color: var(--muted); font-size: 13px; }
.b-eta.is-limit { color: var(--warn); }
.further-list { display: grid; gap: 8px; font-size: 14px; }
.further-list li { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.fl-icon .icon svg { width: 20px; height: 20px; }
.fl-name { color: var(--text); font-weight: 600; }
.fl-when { text-align: right; }

/* Heroes */
.heroes-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.card-head { display: flex; gap: 12px; align-items: center; }
.cands, .heroes, .bag, .forge, .classes { display: grid; gap: 10px; }
.cand { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel-2); }
.cand.is-hired { opacity: 0.65; padding: 8px 12px; }
.cand .b-buy { grid-column: auto; border-top: 1px dashed var(--line); padding-top: 10px; }
.cand-sub { font-size: 14px; }
.hero { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.hero > details > summary { cursor: pointer; padding: 12px; list-style: none; display: flex; align-items: baseline; gap: 8px; }
.cand .b-blurb .item { display: block; margin-top: 2px; }
.hero > details > summary::-webkit-details-marker { display: none; }
.hero > details > summary::before { content: "\25B8"; color: var(--muted); display: inline-block; transition: transform 0.15s; }
.hero > details[open] > summary::before { transform: rotate(90deg); }
.hero-sum { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.hero > details > p { padding: 0 12px; }
.hero-body { padding: 10px 12px 14px; display: grid; gap: 10px; }
.chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--muted); }
.chip.is-good { color: var(--good); border-color: var(--good); }
.chip.is-bad { color: var(--bad); border-color: var(--bad); }
.xpbar { height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
.xpfill { display: block; height: 100%; width: 0; background: var(--accent); }
.statgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 0; }
.statgrid.derived { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.statgrid > div { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.statgrid dt { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.statgrid dd { margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slots li, .forge li { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px dotted var(--line); }
.forge li { grid-template-columns: 70px minmax(0, 1fr) auto; }
.slots { display: grid; gap: 0; }
.slot-name { font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.slot-item { min-width: 0; }
.item { display: inline-block; vertical-align: top; min-width: 0; }
.item-name, .item-lines { display: block; }
.heroes-grid .aside { position: static; }
.item-name { font-weight: 600; }
.item-lines { font-size: 13px; color: var(--muted); }
.r-uncommon .item-name { color: var(--good); }
.r-rare .item-name { color: var(--blue); }
.r-epic .item-name { color: #b58cf0; }
:root[data-theme="light"] .r-epic .item-name { color: #6b46b8; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .r-epic .item-name { color: #6b46b8; } }
.btn-small { min-height: 34px; padding: 4px 10px; font-size: 14px; }
.lock { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.lock input { width: 18px; height: 18px; accent-color: var(--accent); }
.perks { display: grid; gap: 8px; }
.perk { flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.perk span { font-weight: 400; color: var(--muted); }
.perks-taken { display: grid; gap: 4px; font-size: 14px; }
.bag-item { display: grid; gap: 8px; border-bottom: 1px dotted var(--line); padding: 8px 0; }
.bag-sub { display: block; font-size: 12.5px; }
.bag-act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bag-act select { max-width: 150px; min-height: 34px; padding: 4px 8px; }
.class-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 14px; }
.class-row.is-locked { opacity: 0.7; }
.cl-when { white-space: nowrap; color: var(--muted); font-size: 13px; }
@media (min-width: 760px) {
  .heroes-grid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  .cand { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .cand .b-buy { border-top: 0; padding-top: 0; flex-direction: column; align-items: flex-end; }
}
@media (max-width: 520px) {
  .statgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .statgrid.derived { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .class-row { flex-direction: column; gap: 2px; }
}

/* Quests */
.offers, .runs, .history, .picker { display: grid; gap: 8px; }
.offer { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.offer > details > summary { cursor: pointer; padding: 12px; list-style: none; display: flex; align-items: baseline; gap: 8px; }
.offer > details > summary::-webkit-details-marker { display: none; }
.offer > details > summary::before { content: "\25B8"; color: var(--muted); display: inline-block; transition: transform 0.15s; }
.offer > details[open] > summary::before { transform: rotate(90deg); }
.offer-title { font-weight: 600; }
.offer-body { padding: 4px 12px 14px; display: grid; gap: 10px; }
.offer-rewards { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pick { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 2px 4px; border-bottom: 1px dotted var(--line); }
.pick input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.pick label { flex: 1; min-width: 0; }
.pick.is-off { opacity: 0.55; }
.pk-name { font-weight: 600; }
.odds { font-weight: 600; }
.odds.is-good { color: var(--good); }
.odds.is-bad { color: var(--bad); }
.run { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); display: grid; gap: 6px; }
.run-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.result { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.result .chip { flex: none; }

/* Fights */
.watch { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; }
.watch > summary { cursor: pointer; font-size: 14px; color: var(--muted); }
.fight { display: grid; gap: 8px; padding-top: 8px; }
.hpbars { display: grid; gap: 4px; }
.hprow { display: grid; grid-template-columns: minmax(80px, 34%) 1fr 3.4em; gap: 8px; align-items: center; font-size: 13px; }
.hpname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hpbar { height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }

      const ok = canAfford(state2.res, cost);
      const tooBig = costExceedsStorage(state2, cost);
      if (ok) setText(eta, "Ready to upgrade");
      else if (tooBig) setText(eta, `Needs more ${DATA.resourceById[tooBig].name.toLowerCase()} storage than you have. Build or upgrade the Warehouse.`);

      setClass(eta, "is-ready", ok);
      setText(btn, `Upgrade to level ${next}`);
      setAttr(btn, "disabled", !ok);

    let s = rect(168, 120, 64, 32, WALL) + tri(164, 120, 72, 20, ROOF) + rect(194, 132, 12, 20, WOOD);
    if (tier >= 1) s += rect(158, 106, 12, 46, STONE) + tri(156, 106, 16, 10, ROOF);
    if (tier >= 2) s += rect(230, 106, 12, 46, STONE) + tri(228, 106, 16, 10, ROOF);
    if (tier >= 3) s += rect(190, 96, 20, 24, STONE) + tri(188, 96, 24, 14, ROOF);
    return `${s}<path d="M200 ${tier >= 3 ? 82 : 100} v-12 l12 4 l-12 4" fill="var(--accent)" ${OUT}/>`;
  }
  var stall = (x, n) => rect(x, 162, 32, 11, WOOD) + `<path d="M${x - 3} 162 L${x + 35} 162 L${x + 32} 153 L${x} 153 Z" fill="${n ? ROOF : HAY}" ${OUT}/>` + rect(x + 6, 166, 6, 4, HAY) + rect(x + 18, 166, 6, 4, LEAF);
  var tent = (x) => `<path d="M${x} 130 L${x + 12} 112 L${x + 24} 130 Z" fill="${HAY}" ${OUT}/>` + rect(x + 10, 123, 4, 7, DARK);
  var rocks = (n) => Array.from({ length: n }, (_, i) => `<path d="M${14 + i * 16} 176 l5 -11 l9 -2 l5 13 Z" fill="${STONE}" ${OUT}/>`).join("");
  var field = (n) => Array.from({ length: n }, (_, i) => `<path d="M${280 + i * 12} 176 l8 -16 h6 l-8 16 Z" fill="${i % 2 ? HAY : LEAF}" ${OUT}/>`).join("");
  var figure = (x) => `<circle cx="${x}" cy="164" r="3" fill="#e0c3a0" ${OUT}/><rect x="${x - 3}" y="167" width="6" height="9" rx="2" fill="var(--blue)" ${OUT}/>`;
  function wall(level) {
    const tall = level >= 30 ? 22 : level >= 10 ? 16 : 10;
    let s = "";
    for (let x = 12; x < 388; x += 24) s += rect(x, 128 - tall, 22, tall, STONE) + rect(x + 2, 126 - tall, 4, 3, STONE);
    if (level >= 5) s += rect(10, 118 - tall, 14, tall + 10, DARK) + rect(376, 118 - tall, 14, tall + 10, DARK);
    return s;
  }
  function sceneParts(state2) {
    const lv = (id) => levelOf(state2, id);
    const th = state2.town.townHall;
    const tier = th >= 10 ? 3 : th >= 6 ? 2 : th >= 3 ? 1 : 0;
    const away = new Set(state2.quests.active.flatMap((r) => r.party));
    const home = state2.heroes.filter((x) => !away.has(x.id)).length;
    const parts = {
      wall: lv("wall_watchtower") > 0 ? Math.min(40, lv("wall_watchtower")) : 0,
      houses: lv("house") > 0 ? Math.min(6, 1 + Math.floor(lv("house") / 6)) : 0,
      trees: lv("lumber_camp") > 0 ? Math.min(6, 1 + Math.floor(lv("lumber_camp") / 8)) : 0,
      stalls: lv("market") > 0 ? lv("market") >= 20 ? 2 : 1 : 0,
      field: lv("farm") > 0 ? Math.min(7, 2 + Math.floor(lv("farm") / 5)) : 0,
      rocks: lv("quarry") > 0 ? Math.min(4, 1 + Math.floor(lv("quarry") / 8)) : 0,
      tavern: lv("tavern") > 0,
      barracks: lv("barracks") > 0 ? Math.min(3, 1 + Math.floor(lv("barracks") / 4)) : 0,
      chapel: lv("chapel") > 0,
      tower: lv("archives") > 0 || lv("mage_tower") > 0,
      tier,
      heroes: Math.min(6, home),
      era: state2.era ?? 1
    };
    return parts;
  }
  function sceneSvg(p) {
    let s = `<rect width="400" height="180" class="sc-sky"/>`;
    if (p.era > 1) s += `<circle cx="352" cy="46" r="22" fill="none" stroke="#6bd48a" stroke-width="5" opacity="0.8"/><circle cx="352" cy="46" r="12" fill="#6bd48a" opacity="0.35"/>`;
    else s += `<circle cx="340" cy="34" r="14" fill="var(--accent)" opacity="0.55"/>`;
    s += `<path d="M0 118 Q60 84 130 112 T260 104 T400 116 V180 H0 Z" class="sc-far"/><rect y="128" width="400" height="52" class="sc-ground"/>`;
    s += `<path d="M120 180 Q190 150 200 152 Q214 152 290 180 Z" fill="var(--line)" opacity="0.7"/>`;
    if (p.wall) s += wall(p.wall);
    for (let i = 0; i < p.trees; i += 1) s += tree(18 + i * 15, 124 + i % 2 * 5);
    for (let i = 0; i < p.barracks; i += 1) s += tent(296 + i * 28);
    s += hall(p.tier);
    for (let i = 0; i < p.houses; i += 1) s += house([22, 54, 86, 262, 294, 326][i]);
    if (p.tavern) s += rect(244, 128, 30, 24, WOOD) + tri(242, 128, 34, 14, ROOF) + rect(250, 140, 8, 12, DARK) + `<rect x="266" y="134" width="6" height="5" fill="var(--accent)" ${OUT}/>`;
    if (p.chapel) s += rect(348, 134, 18, 18, WALL) + tri(346, 134, 22, 12, ROOF) + rect(354, 112, 6, 22, STONE) + `<path d="M357 104 v8 M353 107 h8" stroke="var(--accent)" stroke-width="2"/>`;
    if (p.tower) s += rect(374, 108, 16, 44, STONE) + tri(372, 108, 20, 14, "#5a5fa8") + `<circle cx="382" cy="124" r="3" fill="var(--accent)"/>`;
    s += rocks(p.rocks);
    for (let i = 0; i < p.stalls; i += 1) s += stall(100 + i * 44, i);
    s += field(p.field);
    for (let i = 0; i < p.heroes; i += 1) s += figure(232 + i * 11);
    return `<svg viewBox="0 0 400 180" role="img" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid slice">${s}</svg>`;
  }
  function sceneCaption(p, state2) {
    const bits = [`Town Hall ${state2.town.townHall}`];
    if (p.houses) bits.push(`${levelOf(state2, "house")} house levels`);
    if (p.wall) bits.push("a wall");
    if (p.tavern) bits.push("a tavern");
    if (p.heroes) bits.push(`${p.heroes} ${p.heroes === 1 ? "hero" : "heroes"} at home`);
    return `Your outpost: ${bits.join(", ")}.`;
  }

  // src/ui/scene.js
  function createScene() {
    const holder = h("div", {});
    const caption = h("p", { class: "scene-caption" });
    const el = h("section", { class: "card scene", id: "scene", "aria-label": "Town picture" }, holder, caption);
    let sig2 = "";
    function update(state2) {
      const p = sceneParts(state2);
      const key = JSON.stringify(p);
      if (key !== sig2) {
        sig2 = key;
        holder.innerHTML = sceneSvg(p);
      }
      setText(caption, sceneCaption(p, state2));
    }
    return { el, update };
  }

  // src/ui/toasts.js
  var WORTHY = [/^Achievement/, /^Standing in/, /is open to the outpost/, /output doubled/, / finished "/, / failed "/, /was hurt/, /retired from the road/, /^Rebuild \d/, /^Era \d/, /called back/];
  var KEEP_MS = 4500;
  var MAX = 3;
  function createToasts() {
    const el = h("div", { class: "toasts", role: "status", "aria-live": "polite" });
    let head = void 0;
    let levels = null;
    function show3(text) {
      while (el.children.length >= MAX) el.firstChild.remove();
      const t = h("p", { class: "toast" }, text);
      el.append(t);
      setTimeout(() => t.remove(), KEEP_MS);
    }
    function update(state2) {
      const log = state2.log ?? [];
      const now = Object.fromEntries(state2.heroes.map((x) => [x.id, x.level]));
      if (head === void 0 || levels === null) {
        head = log[0] ?? null;
        levels = now;
        return;
      }
      const quiet = state2.settings.effects === "off";
      if (log[0] !== head) {
        const fresh = [];
        for (const e of log) {
          if (e === head) break;
          fresh.push(e);
        }
        head = log[0] ?? null;
        if (!quiet) for (const e of fresh.reverse().filter((x) => WORTHY.some((re) => re.test(x.text))).slice(-MAX)) show3(e.text);
      }
      const up = state2.heroes.filter((x) => levels[x.id] !== void 0 && x.level > levels[x.id]);
      levels = now;
      if (!quiet && up.length) show3(up.length === 1 ? `${up[0].name} reached level ${up[0].level}.` : `${up.length} heroes gained levels.`);
    }
    return { el, update };
  }

  // src/ui/app.js
  var TABS = [
    { id: "town", label: "Town", unlocked: () => true },
    { id: "heroes", label: "Heroes", unlocked: (s) => levelOf(s, "tavern") > 0 || s.heroes.length > 0 },
    { id: "quests", label: "Quests", unlocked: (s) => s.heroes.length > 0 || s.quests.active.length > 0 },
    { id: "zones", label: "Zones", unlocked: (s) => s.heroes.length > 0 || s.quests.active.length > 0 },
    { id: "rebuild", label: "Rebuild", unlocked: (s) => rebuildPreview(s).can || renownTotal(s) > 0 || s.stats.rebuilds > 0 || retireOpen(s) || (s.era ?? 1) > 1 || (s.prestige.bosses ?? []).length > 0 },
    { id: "settings", label: "Settings", unlocked: () => true }
  ];
  function createApp(root2, ctx2) {
    const strip = createResourceStrip(ctx2);
    const town = createTown(ctx2);
    const settings = createSettings(ctx2);
    const heroes = createHeroes(ctx2);
    const quests = createQuests(ctx2);
    const zones = createZones(ctx2);
    const rebuild2 = createRebuild(ctx2, { onDone: () => {
      active = "town";
    } });
    const go = (id) => {
      active = id;
      ctx2.refresh();
    };
    const tutorial = createTutorial(ctx2, { onGo: go });
    const scene = createScene();
    const toasts = createToasts();
    const eventCard = createEventCard(ctx2);
    const panels = { town: town.el, heroes: heroes.el, quests: quests.el, zones: zones.el, rebuild: rebuild2.el, settings: settings.el };
    let active = "town";
    const kicker = h("p", { class: "kicker" }, "Elwynn Forest \xB7 Alliance frontier");
    const saveChip = h("span", { class: "save-chip", role: "status" });
    const notice = h("p", { class: "notice", role: "alert", hidden: true });
    const live = h("div", { class: "sr-only", "aria-live": "polite", id: "live" });
    const tabButtons = {};
    const tabs = h(
      "nav",
      { class: "tabs", "aria-label": "Sections" },
      h("div", { class: "tabs-inner" }, TABS.map((t) => {
        const b = h("button", { class: "tab", type: "button", hidden: true, onClick: () => {
          active = t.id;
          ctx2.refresh();
        } }, t.label);
        tabButtons[t.id] = b;
        return b;
      }))
    );
    root2.append(
      h(
        "header",
        { class: "masthead" },
        h(
          "div",
          {},
          kicker,
          h("h1", { class: "title" }, "Outpost of Azeroth")
        ),
        saveChip
      ),
      h("a", { class: "skip", href: "#panel-area" }, "Skip to the main content"),
      notice,
      eventCard.el,
      tutorial.el,
      strip.el,
      tabs,
      h("main", { class: "main", id: "panel-area", tabindex: "-1" }, scene.el, town.el, heroes.el, quests.el, zones.el, rebuild2.el, settings.el),
      h("footer", { class: "foot" }, "Unofficial fan project. Warcraft belongs to Blizzard Entertainment."),
      toasts.el,
      live
    );
    function update(state2) {
      document.documentElement.dataset.motion = state2.settings.reducedMotion === "on" ? "reduce" : state2.settings.reducedMotion === "off" ? "full" : "auto";
      setText(kicker, (state2.era ?? 1) > 1 ? `Era ${state2.era} \xB7 Hellfire Peninsula` : "Elwynn Forest \xB7 Alliance frontier");
      const root3 = document.documentElement;
      if (state2.settings.theme === "auto") delete root3.dataset.theme;
      else root3.dataset.theme = state2.settings.theme;
      root3.dataset.text = state2.settings.textSize;
      root3.dataset.effects = state2.settings.effects;
      root3.lang = "en";
      for (const t2 of TABS) {
        const open = t2.unlocked(state2);
        tabButtons[t2.id].hidden = !open;
        setAttr(tabButtons[t2.id], "aria-current", open && active === t2.id ? "page" : false);
        setClass(tabButtons[t2.id], "is-active", active === t2.id);
      }
      for (const [id, el] of Object.entries(panels)) el.hidden = id !== active;
      tutorial.update(state2);
      eventCard.update(state2);
      toasts.update(state2);
      scene.el.hidden = !(active === "town" && state2.settings.scene === "on");
      if (!scene.el.hidden) scene.update(state2);
      const info = incomeBreakdown(state2);
      strip.update(state2, info);
      if (active === "town") town.update(state2, info);
      if (active === "heroes") heroes.update(state2);
      if (active === "quests") quests.update(state2);
      if (active === "zones") zones.update(state2);
      if (active === "rebuild") rebuild2.update(state2);
      if (active === "settings") settings.update(state2);
      const t = ctx2.lastSave();
      if (!ctx2.storageOk()) setText(saveChip, "Not saved: use Export");
      else setText(saveChip, t ? `Saved ${Math.max(0, Math.round((Date.now() - t) / 1e3))}s ago` : "Not saved yet");
      setClass(saveChip, "bad", !ctx2.storageOk());
      const n = ctx2.notice();
      notice.hidden = !n;
      if (n) setText(notice, n);
    }
    return {
      update,
      announce(text) {
        live.textContent = "";
        setTimeout(() => {
          live.textContent = text;
        }, 30);
      },
      welcomeSlot: town.welcomeSlot
    };
  }

  // src/ui/welcome.js
  function createWelcome(report, mode, onClose) {
    const gains = DATA.resources.filter((r) => report.gains[r.id] > 0).map((r) => h("li", {}, h("span", {}, r.name), h("span", { class: "lead" }), h("span", {}, `+${fmt(report.gains[r.id], mode)}`)));
    const levels = (report.heroLevels ?? []).map((x) => h("li", {}, h("span", {}, x.name), h("span", { class: "lead" }), h("span", {}, `level ${x.from} to ${x.to}`)));
    const qs = report.quests;
    const questLines = [];
    if (qs && (qs.done || qs.failed)) {
      questLines.push(h("li", {}, h("span", {}, "Quests won"), h("span", { class: "lead" }), h("span", {}, String(qs.done))));
      if (qs.failed) questLines.push(h("li", {}, h("span", {}, "Quests failed"), h("span", { class: "lead" }), h("span", {}, String(qs.failed))));
      if (qs.gold) questLines.push(h("li", {}, h("span", {}, "Bounty gold"), h("span", { class: "lead" }), h("span", {}, `+${fmt(qs.gold, mode)}`)));
      if (qs.items) questLines.push(h("li", {}, h("span", {}, "Items found"), h("span", { class: "lead" }), h("span", {}, String(qs.items))));
      if (qs.sold) questLines.push(h("li", {}, h("span", {}, "Spare gear sold"), h("span", { class: "lead" }), h("span", {}, `+${fmt(qs.sold, mode)}`)));
      if (qs.firstClears) questLines.push(h("li", {}, h("span", {}, "First clears"), h("span", { class: "lead" }), h("span", {}, String(qs.firstClears))));
      for (const [id, amt] of Object.entries(qs.res)) questLines.push(h("li", {}, h("span", {}, `${DATA.resourceById[id].name} brought back`), h("span", { class: "lead" }), h("span", {}, `+${fmt(amt, mode)}`)));
    }
    const reduced = report.credited < report.elapsed - 1;
    return h(
      "section",
      { class: "card welcome", role: "region", "aria-label": "While you were away" },
      h("h2", { class: "h-sec" }, "While you were away"),
      h("p", {}, `The outpost ran for ${fmtDuration(report.elapsed)} and earned ${fmtDuration(report.credited)} of production.`),
      reduced ? h("p", { class: "muted" }, report.beyondLimit ? "Time away counts in full for the first 15 minutes, then at 40% to 2 hours, 15% to 12 hours and 5% up to 3 days. Anything past 3 days is not counted. Playing is worth more than waiting." : "Time away counts in full for the first 15 minutes, then at 40% to 2 hours, 15% to 12 hours and 5% up to 3 days. Playing is worth more than waiting.") : null,
      gains.length ? h("ul", { class: "gains" }, gains) : null,
      levels.length ? h("p", { class: "muted" }, "Heroes who trained while you were away:") : null,
      levels.length ? h("ul", { class: "gains" }, levels) : null,
      questLines.length ? h("p", { class: "muted" }, "Parties on the road:") : null,
      questLines.length ? h("ul", { class: "gains" }, questLines) : null,
      qs && qs.running ? h("p", { class: "muted" }, `${qs.running} ${qs.running === 1 ? "party is" : "parties are"} still out.`) : null,
      h("button", { class: "btn", type: "button", onClick: onClose }, "Back to the outpost")
    );
  }

  // src/main.js
  var eco = DATA.economy;
  var problems = validateData();
  if (problems.length) console.error("Game data problems:", problems);
  var state;
  var noticeText = "";
  var lastSave = 0;
  var storageOk = true;
  var saveTimer = null;
  var renderQueued = false;
  function freshGame() {
    return newState({ seed: newSeed(), now: Date.now() });
  }
  function load() {
    const raw = readSave();
    if (!raw) return freshGame();
    try {
      return deserialize(raw);
    } catch (err) {
      setAsideBrokenSave(raw);
      noticeText = `Your saved game could not be read. ${err.message} A copy was kept aside and a new game has started. You can still load an export string in Settings.`;
      return freshGame();
    }
  }
  function save() {
    storageOk = writeSave(serialize(state));
    if (storageOk) lastSave = Date.now();
    return storageOk;
  }
  var ctx = {
    state: () => state,
    // Run a validated action. On success the new state replaces the old one.
    run(fn) {
      const result = fn(state);
      if (result.ok) {
        state = result.state;
        refresh();
      }
      return result;
    },
    refresh,
    pulse(el) {
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    },
    announce: (text) => app.announce(text),
    saveSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 1e3);
    },
    saveNow: save,
    lastSave: () => lastSave,
    storageOk: () => storageOk,
    notice: () => noticeText,
    exportState: () => exportString(state),
    async importText(text) {
      try {
        const imported = await importString(text);
        state = imported;
        catchUp(Date.now());
        save();
        refresh();
        return { ok: true };
      } catch (err) {
        return { ok: false, error: err.message };
      }
    },
    eraseAll() {
      eraseSave();
      state = freshGame();
      noticeText = "";
      lastSave = 0;
      save();
      refresh();
    }
  };
  var root = document.getElementById("app");
  var app = createApp(root, ctx);
  function refresh() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => {
      renderQueued = false;
      app.update(state);
    });
  }
  function showWelcome(report) {
    const slot = app.welcomeSlot;
    const card = createWelcome(report, state.settings.numberFormat, () => card.remove());
    slot.replaceChildren(card);
  }
  function catchUp(now) {
    const { state: next, report } = advance(state, now);
    state = next;
    if (report.elapsed >= eco.welcomeBackMinSeconds) showWelcome(report);
  }
  state = load();
  catchUp(Date.now());
  save();
  refresh();
  var hiddenAt = null;
  var hiddenRes = null;
  var hiddenHeroes = [];
  var hiddenSeq = 0;
  setInterval(() => {
    state = advance(state, Date.now()).state;
    refresh();
  }, eco.tickSeconds * 1e3);
  setInterval(save, 3e4);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      hiddenAt = Date.now();
      hiddenRes = { ...state.res };
      hiddenSeq = state.quests.seq;
      hiddenHeroes = state.heroes.map((x) => ({ id: x.id, name: x.name, level: x.level }));
      state = advance(state, hiddenAt).state;
      save();
    } else if (hiddenAt !== null) {
      const now = Date.now();
      state = advance(state, now).state;
      const elapsed = (now - hiddenAt) / 1e3;
      if (elapsed >= eco.welcomeBackMinSeconds) {
        const gains = {};
        for (const r of DATA.resources) gains[r.id] = state.res[r.id] - hiddenRes[r.id];
        const heroLevels = state.heroes.map((x) => ({ name: x.name, from: hiddenHeroes.find((o) => o.id === x.id)?.level ?? x.level, to: x.level })).filter((x) => x.to > x.from);
        showWelcome({ elapsed, credited: effectiveSeconds(elapsed, DATA.economy.offlineTiers, bonusOf(state, "offlineRate")), gains, beyondLimit: elapsed > eco.offlineTiers.at(-1).upToSeconds, heroLevels, quests: questSummary({ quests: { seq: hiddenSeq } }, state) });
      }
      hiddenAt = null;
      refresh();
    }
  });
  window.addEventListener("pagehide", () => {
    state = advance(state, Date.now()).state;
    save();
  });
})();

</script>
